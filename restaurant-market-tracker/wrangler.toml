name = "restaurant-market-tracker"
main = ".open-next/worker.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "market-tracker"
# Local dev works with any UUID. Replace with the real id from
# `npx wrangler d1 create market-tracker` before deploying.
database_id = "a368ee13-48bc-4124-ac28-db4c9798c580"

[vars]
ENVIRONMENT = "production"
